name: Refresh dashboard data

# Runs the GovScout pipeline against the live SAM.gov API and commits the
# resulting JSON straight into src/data/dashboard.json.
#
# Quota note: SAM_API_KEY is a personal api.data.gov key without an entity
# role, confirmed capped at 10 requests/day (not an estimate — Braeden
# checked, 2026-08-02; expected to rise once his EIN/entity-role
# verification comes through). pipeline/config.json defines a weekly
# psc_rotation (Mon-Sun PSC/FSC groups) and pins max_pages to 3, so a normal
# run queries only today's group and spends ~3 requests — comfortably
# inside the daily budget with headroom for manual re-runs.
# Results accumulate into dashboard.json across the week (see
# export_json_accumulated in report.py) instead of replacing it, so the
# board fills up over Mon-Sun as each group gets its turn; stale/expired
# solicitations are dropped automatically. See "Free-tier PSC rotation" in
# README.md. If you add an entity role to the key (raises the quota to
# ~1000/day), you can drop psc_rotation and query psc_codes directly every
# day — raise max_pages in pipeline/config.json accordingly.
#
# Scheduling gotcha: GitHub disables scheduled workflows after 60 days of
# repository inactivity (no pushes/commits). If daily runs silently stop,
# push any commit to the repo (or re-enable the workflow from the Actions
# tab) to reactivate the schedule.
#
# Coverage ledger (`sync`): pipeline/govscout/coverage.py tracks per
# (code, month) "slice" fetch state in pipeline/coverage_ledger.csv, and is
# meant to eventually replace the psc_rotation `fetch` above as the one
# mechanism for both backfilling history and keeping the board fresh. It's
# manual-dispatch-only for now (provide the "slices" input below) — the
# daily schedule still runs the old `fetch` step until the tracked_codes
# list is confirmed and a real run has been verified.

on:
  schedule:
    - cron: "0 13 * * *" # 13:00 UTC daily (~9am US Eastern)
  workflow_dispatch:
    inputs:
      slices:
        description: "Coverage-ledger slices to process via `sync` (backfill/refresh). Leave blank to run the existing daily `fetch` instead."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-dashboard
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pipeline dependencies
        run: pip install -r pipeline/requirements.txt

      - name: Fetch live SAM.gov data
        id: fetch
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.slices == ''
        working-directory: pipeline
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: python -m govscout fetch --json ../src/data/dashboard.json
        continue-on-error: true

      - name: Sync coverage ledger (manual backfill/refresh)
        id: sync
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.slices != ''
        working-directory: pipeline
        env:
          SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
        run: python -m govscout sync --slices "${{ github.event.inputs.slices }}" --json ../src/data/dashboard.json
        continue-on-error: true

      - name: Check for changes
        id: diff
        if: steps.fetch.outcome == 'success' || steps.sync.outcome == 'success'
        run: |
          # git status --porcelain (not `git diff --quiet`) so this also
          # catches pipeline/coverage_ledger.csv on the very first sync run,
          # when it's a brand-new untracked file rather than a modified one
          # — `git diff` alone is blind to untracked files.
          if [ -n "$(git status --porcelain -- src/data/dashboard.json pipeline/coverage_ledger.csv)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push updated data
        if: (steps.fetch.outcome == 'success' || steps.sync.outcome == 'success') && steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/dashboard.json
          # Only present after a `sync` run (the fetch path never creates it)
          # — `git add` errors on a pathspec that matches nothing.
          if [ -f pipeline/coverage_ledger.csv ]; then
            git add pipeline/coverage_ledger.csv
          fi
          git commit -m "chore: refresh dashboard data from SAM.gov"
          git push

      - name: Fail visibly on fetch error (no commit made)
        if: steps.fetch.outcome == 'failure'
        run: |
          echo "::error::Fetch step failed (exit code non-zero). Leaving existing dashboard.json untouched. See the 'Fetch live SAM.gov data' step above (and its own ::error:: annotation, if any) for the actual cause — HTTP status/response body for a SAM.gov API failure, or a Python traceback if it's a code bug."
          exit 1

      - name: Fail visibly on sync error
        if: steps.sync.outcome == 'failure'
        run: |
          echo "::error::Sync step failed (exit code non-zero) — this means setup failed (missing key/tracked_codes), not a routine per-slice failure (those are logged in coverage_ledger.csv and retried automatically, and don't fail this step). See the 'Sync coverage ledger' step above for details."
          exit 1
